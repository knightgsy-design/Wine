<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GYC Events — Guernsey Yacht Club</title>
  <meta name="description" content="Book your place at Guernsey Yacht Club events: Halloween Buffet Supper (31 Oct), the Gin & Rum Tasting at Wheadon's Bunker (14 Nov) and the Christmas Crew Lunch (19 Dec)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Burgee palette: sea navy structures, signal red commits, white sail carries content. */
      --sea: #0a2240;
      --sea-deep: #061528;
      --sea-mid: #123a63;
      --flag: #d0161b;          /* the burgee's red — every Pay button, every event */
      --flag-dark: #a90f14;
      --flag-bright: #ff6a6e;   /* the same red, lifted to read on navy */
      --chart: #ebf0f5;         /* page ground: cool chart paper */
      --ink: #14202e;
      --ink-soft: #4d5b6d;
      --line: #d6dde6;
      --err: #a3372f;
      /* per-event identity (hero field, pennant, tab marker, menu rule) — overridden per panel */
      --accent: var(--sea-mid);
      --accent-ink: var(--sea-mid);   /* the accent as text/rules on white */
      --hero: var(--sea);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; background: var(--chart); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; margin: 0; }

    /* ---------------- Intro ---------------- */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(180deg, #050f1b 0%, #0f2a43 62%, #17405f 100%);
      overflow: hidden; display: grid; place-items: center;
      transition: opacity .9s ease, visibility .9s;
    }
    #intro.done { opacity: 0; visibility: hidden; }
    #intro svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    .star:nth-child(3n) { animation-delay: .7s; }
    .star:nth-child(3n+1) { animation-delay: 1.6s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    .moon { animation: moonrise 3.2s ease-out both; }
    @keyframes moonrise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
    .wave-a { animation: drift 9s linear infinite; }
    .wave-b { animation: drift 6s linear infinite reverse; }
    .wave-c { animation: drift 4.5s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    .boat { animation: sail 5.4s cubic-bezier(.35,.1,.35,1) .3s both; }
    @keyframes sail { from { transform: translateX(-180px); } to { transform: translateX(980px); } }
    .boat-bob { transform-origin: 90px 120px; animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-5px); } }
    .intro-text { position: relative; text-align: center; color: #fff; padding: 0 20px; margin-top: -8vh; }
    .intro-text .club { font-family: 'Inter'; font-size: clamp(11px, 2.4vw, 15px); letter-spacing: .5em; text-transform: uppercase; color: var(--flag-bright); opacity: 0; animation: rise .9s ease 1.1s forwards; }
    .intro-text .big { font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(64px, 22vw, 150px); line-height: 1; letter-spacing: .04em; margin-top: 10px; }
    .intro-text .big .line { white-space: nowrap; }
    .intro-text .big .line:last-child { font-size: .62em; letter-spacing: .12em; color: var(--flag-bright); margin-top: 4px; }
    .intro-text .big span { display: inline-block; opacity: 0; transform: translateY(40px) scale(.9); animation: letter .7s cubic-bezier(.2,.9,.3,1.2) forwards; }
    .intro-text .tag { margin-top: 16px; font-size: clamp(13px, 3vw, 17px); color: #c6d4e0; opacity: 0; animation: rise .9s ease 2.9s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes letter { to { opacity: 1; transform: none; } }
    #skip { position: absolute; right: 18px; bottom: 18px; z-index: 2; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 18px; font: 600 13px 'Inter'; cursor: pointer; backdrop-filter: blur(4px); }
    #skip:hover { background: rgba(255,255,255,.22); }

    /* ---------------- Page chrome ---------------- */
    header.site { background: var(--sea); color: #fff; padding: 20px 16px 0; }
    .site-inner { max-width: 880px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; }
    .brand svg { width: 38px; height: 38px; flex: none; }
    .brand b { font-family: 'Playfair Display', serif; font-size: 22px; display: block; line-height: 1.1; }
    .brand span { font-size: 11.5px; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.72); }

    nav.tabs { position: sticky; top: 0; z-index: 20; background: var(--sea); display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 0; margin: 0 -16px; scrollbar-width: none; box-shadow: 0 6px 14px -10px rgba(0,0,0,.6); }
    nav.tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 1 0 auto; min-width: 150px; text-align: left; cursor: pointer; border: 0; background: rgba(255,255,255,.07); color: #c6d4e0; padding: 13px 18px 12px; border-radius: 12px 12px 0 0; font: inherit; border-bottom: 4px solid transparent; transition: background .2s, color .2s; }
    .tab:hover { background: rgba(255,255,255,.14); color: #fff; }
    .tab .t { display: block; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: inherit; }
    .tab .d { display: block; font-size: 12px; margin-top: 2px; opacity: .85; }
    .tab[aria-selected="true"] { background: var(--chart); color: var(--ink); border-bottom-color: var(--tab-accent, var(--flag)); }
    .tab[data-event="halloween"] { --tab-accent: #e8741a; }
    .tab[data-event="gin-rum"] { --tab-accent: #2a9d8f; }
    .tab[data-event="christmas-lunch"] { --tab-accent: #3f8f5e; }

    main { max-width: 880px; margin: 0 auto; padding: 0 16px 60px; }
    .panel[hidden] { display: none; }
    .panel[data-event="halloween"] { --accent: #e8741a; --accent-ink: #b4560d; --hero: #24102e; }
    .panel[data-event="gin-rum"] { --accent: #2a9d8f; --accent-ink: #1d6f65; --hero: #08282b; }
    .panel[data-event="christmas-lunch"] { --accent: #3f8f5e; --accent-ink: #2f6b45; --hero: #0a2240; }

    .hero { margin: 0 -16px; padding: 38px 24px 36px; background: var(--hero); color: #fff; text-align: center; border-radius: 0; position: relative; overflow: hidden; isolation: isolate; }
    /* a burgee-shaped cut of the event's colour: the one bold thing on the page */
    .hero::before { content: ''; position: absolute; z-index: -1; top: 0; bottom: 0; right: 0; width: 34%; background: var(--accent); clip-path: polygon(100% 0, 100% 100%, 0 100%, 100% 0); opacity: .9; }
    @media (max-width: 560px) { .hero::before { width: 38%; } }
    .hero .eyebrow { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #fff; font-weight: 700; opacity: .85; }
    .hero h2 { font-size: clamp(30px, 7vw, 46px); line-height: 1.1; margin: 10px 0 8px; }
    .hero .sub { color: rgba(255,255,255,.82); font-size: 15px; max-width: 520px; margin: 0 auto; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 20px; }
    .chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 15px; font-size: 13.5px; font-weight: 600; }
    .price-badge { display: inline-block; margin-top: 20px; background: #fff; color: var(--sea); font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; padding: 10px 28px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    .hero .burgee { display: block; width: 150px; height: auto; margin: 0 auto 18px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
    .menu-course { margin-top: 18px; }
    .menu-course h4 { font: 700 17px 'Playfair Display', serif; color: var(--sea); margin: 0 0 2px; }
    .menu-course .pick { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }
    .menu-course ul { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--accent-ink); }
    .menu-course li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .menu-course .dish { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .menu-course .desc { color: var(--ink-soft); font-size: 13.5px; line-height: 1.45; margin-top: 3px; }
    .tag { display: inline-block; font-weight: 700; font-size: 11px; line-height: 1; color: #2f6b45; border: 1.5px solid #2f6b45; border-radius: 999px; padding: 3px 7px 2px; margin-left: 6px; vertical-align: 2px; }
    .menu-key { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
    .deco { position: absolute; font-size: 54px; opacity: .16; user-select: none; pointer-events: none; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 18px; }
    .card h3 { font-size: 18px; margin-bottom: 12px; color: var(--sea); }
    .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
    .facts li { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; }
    .facts .i { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, white); font-size: 16px; }
    .callout { margin-top: 16px; padding: 13px 16px; border-left: 4px solid var(--accent-ink); background: color-mix(in srgb, var(--accent) 9%, white); border-radius: 8px; font-size: 14px; line-height: 1.55; }

    .closes { margin: -4px 0 14px; font-size: 13.5px; color: var(--ink-soft); }
    .avail { margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; }
    .avail-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .avail .count { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 28px; color: var(--sea); }
    .avail .label { font-size: 13px; color: var(--ink-soft); }
    .bar { margin-top: 12px; height: 10px; border-radius: 999px; background: #e4ebf1; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent-ink); border-radius: 999px; transition: width .5s ease; }

    form { display: grid; gap: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; }
    .hint { font-weight: 400; color: var(--ink-soft); }
    input, select, textarea { font: inherit; font-size: 15px; padding: 11px 13px; border: 1px solid #c8d3dd; border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--sea); outline-offset: 1px; border-color: var(--sea); }
    textarea { resize: vertical; min-height: 64px; }
    .meals { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 7%, white); border: 1px dashed color-mix(in srgb, var(--accent) 55%, white); }
    .meals > b { font-size: 13px; }
    .meal-help { font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }
    .meal-guest { display: grid; gap: 7px; padding-bottom: 10px; border-bottom: 1px solid color-mix(in srgb, var(--accent) 25%, white); }
    .meal-guest:last-child { border-bottom: 0; padding-bottom: 0; }
    .meal-guest > span { font-weight: 600; font-size: 13.5px; }
    .meal-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; font-size: 13.5px; }
    button.pay { background: var(--flag); color: #fff; border: 0; border-radius: 12px; padding: 15px 20px; font: 700 17px 'Playfair Display', serif; cursor: pointer; transition: filter .15s, transform .1s; }
    button.pay:hover { background: var(--flag-dark); }
    button.pay:focus-visible, .tab:focus-visible, #skip:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
    button.pay:active { transform: translateY(1px); }
    button.pay:disabled { background: #a9b6c2; cursor: not-allowed; }
    .secure { font-size: 12.5px; color: var(--ink-soft); text-align: center; line-height: 1.5; margin: 0; }
    .msg { display: none; border-radius: 10px; padding: 12px 15px; font-size: 14px; line-height: 1.5; background: #fbeceb; border: 1px solid var(--err); color: #7a251f; }
    .msg.show { display: block; }
    .full { display: none; text-align: center; padding: 18px; color: var(--ink-soft); font-size: 15px; }
    .full.show { display: block; }

    footer.site { text-align: center; padding: 28px 16px 40px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; }
    footer.site a { color: var(--sea); }

    @media (prefers-reduced-motion: reduce) {
      .wave-a, .wave-b, .wave-c, .boat-bob, .star, .moon { animation: none; }
      .boat { animation: none; transform: translateX(380px); }
      .intro-text .club, .intro-text .tag, .intro-text .big .line { white-space: nowrap; }
    
    .intro-text .big span { animation: none; opacity: 1; transform: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <!-- ============ Animated intro ============ -->
  <div id="intro" aria-hidden="true">
    <svg class="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c5379"/><stop offset="1" stop-color="#08203a"/></linearGradient>
        <radialGradient id="moonglow"><stop offset="0" stop-color="#fff6d6" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="stars"></g>
      <g class="moon"><circle cx="640" cy="90" r="90" fill="url(#moonglow)"/><circle cx="640" cy="90" r="30" fill="#fff6d6"/></g>
      <rect y="300" width="800" height="150" fill="url(#sea)"/>
      <g class="boat" transform="translate(0,0)"><g transform="translate(0,222)"><g class="boat-bob">
        <path d="M20 118 H160 L142 146 H44 Z" fill="#f4efe2"/>
        <path d="M20 118 H160" stroke="#d0161b" stroke-width="4"/>
        <rect x="88" y="14" width="4" height="106" fill="#e8e0cc"/>
        <path d="M94 18 L94 112 L152 112 Z" fill="#ffffff"/>
        <path d="M86 28 L86 112 L36 112 Z" fill="#d0161b"/>
        <path d="M88 14 l16 6 l-16 6 z" fill="#ff6a6e"/>
      </g></g></g>
      <g class="wave-c" opacity=".55"><path d="M0 330 q50 -18 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V450 H0 Z" fill="#2b6d94"/></g>
      <g class="wave-b" opacity=".8"><path d="M0 350 q50 -22 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V450 H0 Z" fill="#164a6e"/></g>
      <g class="wave-a"><path d="M0 378 q50 -26 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V450 H0 Z" fill="#0b2e4b"/></g>
    </svg>
    <div class="intro-text">
      <div class="club">Guernsey Yacht Club</div>
      <div class="big" id="bigword" aria-label="GYC Events"></div>
      <div class="tag">Good company. Good events. Book your place.</div>
    </div>
    <button id="skip" type="button">Skip intro ›</button>
  </div>

  <!-- ============ Site ============ -->
  <header class="site">
    <div class="site-inner">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/><path d="M19 7 V30 H8 Z" fill="#fff"/><path d="M21 11 V30 H33 Z" fill="#d0161b"/><path d="M6 33 q7 -4 14 0 t14 0" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/></svg>
        <div><b>GYC Events</b><span>Guernsey Yacht Club</span></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Choose an event"></nav>
    </div>
  </header>

  <main id="panels"></main>

  <footer class="site">
    Guernsey Yacht Club &middot; Payment is taken securely online (SumUp) and confirms your place.<br />
    Questions? <a href="mailto:events@gyc.org.gg">events@gyc.org.gg</a>
  </footer>

  <script>
    /* ---------- Event content (display copy only — the server owns price & capacity) ---------- */
    const EVENTS = [
      {
        id: 'halloween',
        tab: 'Halloween Buffet Supper',
        short: '31 Oct · from 6.30pm',
        eyebrow: 'Saturday 31st October 2026',
        title: 'Halloween Buffet Supper',
        sub: 'A spooky supper at the club — and a prize for the best costume.',
        price: 20,
        maxPerBooking: 10,
        deco: ['🎃', '🕸️', '🦇'],
        facts: [
          ['📅', '<b>Saturday 31st October 2026</b>'],
          ['🕡', 'From <b>6.30pm</b>'],
          ['📍', 'Guernsey Yacht Club'],
          ['🍽️', 'Buffet supper'],
          ['🎭', '<b>Dress to impress!</b> (optional)'],
          ['🏆', 'Prize for the <b>best costume</b>'],
        ],
        callout: null,
      },
      {
        id: 'gin-rum',
        tab: 'Gin & Rum Tasting',
        short: '14 Nov · 5.30pm',
        eyebrow: 'Saturday 14th November 2026',
        title: 'Gin &amp; Rum Tasting',
        sub: "Come and enjoy the many flavours now offered by Wheadon's.",
        price: 35,
        maxPerBooking: 8,
        hasMenu: true,
        deco: ['🥃', '🍸', '🍹'],
        facts: [
          ['📅', '<b>Saturday 14th November 2026</b>'],
          ['🕠', 'Starts <b>5.30pm</b>'],
          ['📍', "<b>Wheadon's Bunker</b>, Castle Emplacement"],
          ['🍽️', 'Dinner included — choose <b>Beef Stroganoff with veg rice</b> or <b>Cauliflower Steak (V)</b>'],
          ['🎟️', '<b>Limited to 24 tickets</b>'],
        ],
        callout: 'Discounted deals will be available on the night on a range of gins, vodkas and rums.',
      },
      {
        id: 'christmas-lunch',
        tab: 'Christmas Crew Lunch',
        short: '19 Dec · from 3pm',
        eyebrow: 'Saturday 19th December 2026',
        title: 'Christmas Crew Lunch',
        sub: 'Come straight off the water for a proper Christmas lunch with your crew. Racing or not, everyone is welcome.',
        price: 27.5,
        maxPerBooking: 30,
        hasMenu: true,
        burgee: true,
        deco: ['🎄', '❄️', '🎅'],
        facts: [
          ['📅', '<b>Saturday 19th December 2026</b>'],
          ['🕒', 'From <b>3pm</b>, once the boats are in'],
          ['📍', 'Guernsey Yacht Club'],
          ['🍽️', '<b>Two courses</b> — everyone chooses a main and a dessert'],
          ['🤝', 'No limit on numbers — bring the whole crew'],
        ],
        callout: null,
      },
    ];

    const $ = (s, r = document) => r.querySelector(s);
    const money = (n) => '£' + Number(n).toFixed(2).replace(/\.00$/, '');

    /* ---------- Intro ---------- */
    (function intro() {
      const el = $('#intro');
      const big = $('#bigword');
      let n = 0;
      ['GYC', 'EVENTS'].forEach((word) => {
        const line = document.createElement('div');
        line.className = 'line';
        [...word].forEach((ch) => {
          const s = document.createElement('span');
          s.textContent = ch;
          s.style.animationDelay = (1.5 + n++ * 0.09) + 's';
          line.appendChild(s);
        });
        big.appendChild(line);
      });
      const stars = $('#stars');
      for (let i = 0; i < 46; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'star');
        c.setAttribute('cx', (Math.random() * 800).toFixed(0));
        c.setAttribute('cy', (Math.random() * 250).toFixed(0));
        c.setAttribute('r', (Math.random() * 1.4 + .4).toFixed(1));
        stars.appendChild(c);
      }
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let seen = false;
      try { seen = sessionStorage.getItem('gycIntro') === '1'; } catch (e) {}
      let timer;
      const finish = () => {
        clearTimeout(timer);
        el.classList.add('done');
        try { sessionStorage.setItem('gycIntro', '1'); } catch (e) {}
        document.body.style.overflow = '';
        setTimeout(() => el.remove(), 1000);
      };
      if (seen) { el.remove(); return; }
      document.body.style.overflow = 'hidden';
      $('#skip').addEventListener('click', finish);
      el.addEventListener('click', finish);
      timer = setTimeout(finish, reduced ? 1400 : 5600);
    })();

    /* ---------- Tabs & panels ---------- */
    const tabsEl = $('#tabs');
    const panelsEl = $('#panels');

    EVENTS.forEach((ev) => {
      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.type = 'button';
      tab.dataset.event = ev.id;
      tab.setAttribute('role', 'tab');
      tab.innerHTML = `<span class="t">${ev.tab}</span><span class="d">${ev.short}</span>`;
      tab.addEventListener('click', () => select(ev.id, true));
      tabsEl.appendChild(tab);

      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.dataset.event = ev.id;
      panel.hidden = true;
      panel.setAttribute('role', 'tabpanel');
      panel.innerHTML = `
        <div class="hero">
          ${ev.burgee ? '<img class="burgee" src="/assets/gyc-burgee.png" alt="GYC burgee" />' : ''}
          <span class="deco" style="left:6%;top:18%">${ev.deco[0]}</span>
          <span class="deco" style="right:8%;top:12%;font-size:70px">${ev.deco[1]}</span>
          <span class="deco" style="right:22%;bottom:10%">${ev.deco[2]}</span>
          <div class="eyebrow">${ev.eyebrow}</div>
          <h2>${ev.title}</h2>
          <p class="sub">${ev.sub}</p>
          <div class="price-badge" data-price>${money(ev.price)} per head</div>
        </div>

        <div class="card">
          <h3>The details</h3>
          <ul class="facts">${ev.facts.map(([i, t]) => `<li><span class="i">${i}</span><span>${t}</span></li>`).join('')}</ul>
          ${ev.callout ? `<div class="callout">${ev.callout}</div>` : ''}
        </div>

        <div class="card" data-menucard hidden></div>

        <div class="card" id="book-${ev.id}">
          <h3>Book &amp; pay</h3>
          <p class="closes" data-closes hidden></p>
          <form data-form novalidate>
            <div class="two">
              <div class="field"><label>Full name</label><input name="name" autocomplete="name" required /></div>
              <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required /></div>
            </div>
            <div class="two">
              <div class="field"><label>Phone <span class="hint">(optional)</span></label><input name="phone" type="tel" autocomplete="tel" /></div>
              <div class="field"><label>Number of places</label><select name="guests"></select></div>
            </div>
            <div class="meals" data-meals hidden></div>
            <div class="field"><label>${ev.hasMenu ? 'Allergies / dietary notes' : 'Notes'} <span class="hint">(optional)</span></label><textarea name="notes"></textarea></div>
            <div class="msg" data-msg></div>
            <button class="pay" type="submit" data-pay>Pay &amp; confirm</button>
            <p class="secure">🔒 Your place is only confirmed once payment is complete. You'll be taken to SumUp's secure payment page, then sent a confirmation email.</p>
          </form>
          <div class="full" data-full>Sorry — this event is now fully booked.<br />Email <a href="mailto:events@gyc.org.gg">events@gyc.org.gg</a> to join the waiting list.</div>
        </div>`;
      panelsEl.appendChild(panel);
      wire(ev, panel);
    });

    function select(id, push) {
      if (!EVENTS.some((e) => e.id === id)) id = EVENTS[0].id;
      document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.event === id)));
      document.querySelectorAll('.panel').forEach((p) => (p.hidden = p.dataset.event !== id));
      document.title = EVENTS.find((e) => e.id === id).title.replace(/&amp;/g, '&') + ' — GYC Events';
      if (push) history.replaceState(null, '', '#' + id);
      window.scrollTo({ top: 0 });
    }
    window.addEventListener('hashchange', () => select(location.hash.slice(1), false));

    /* ---------- Per-event behaviour ---------- */
    const TAG_TEXT = { V: 'V', GF: 'GF', GFO: 'GF option' };
    const tagList = (tags) => (tags || []).map((t) => TAG_TEXT[t] || t);
    const esc = (t) => String(t ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

    function wire(ev, panel) {
      const form = $('[data-form]', panel);
      const guestsSel = form.elements.guests;
      const pay = $('[data-pay]', panel);
      const msg = $('[data-msg]', panel);
      const mealsEl = $('[data-meals]', panel);
      let price = ev.price;
      let courses = null; // the menu, as served by the API

      const total = () => Number(guestsSel.value || 1) * price;
      const setLabel = () => { pay.innerHTML = `Pay ${money(total())} &amp; confirm`; };
      const showErr = (t) => { msg.textContent = t; msg.classList.add('show'); };

      function renderMenuCard() {
        const card = $('[data-menucard]', panel);
        const described = courses && courses.some((c) => c.items.some((i) => i.desc));
        if (!described) { card.hidden = true; return; }
        const anyTags = courses.some((c) => c.items.some((i) => (i.tags || []).length));
        card.innerHTML = '<h3>The menu</h3>' + courses.map((c) => `
          <div class="menu-course">
            <h4>${esc(c.label)}</h4><p class="pick">Choose one</p>
            <ul>${c.items.map((i) => `<li><div class="dish">${esc(i.name)}${tagList(i.tags).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ''}</li>`).join('')}</ul>
          </div>`).join('') +
          (anyTags ? '<p class="menu-key">V is vegetarian, GF is gluten free, and GF option means the kitchen can make it gluten free. Tell us about any dietary requirements when you book.</p>' : '');
        card.hidden = false;
      }

      function renderMeals() {
        if (!courses) { mealsEl.hidden = true; return; }
        const n = Number(guestsSel.value || 1);
        const keep = {};
        mealsEl.querySelectorAll('select, input').forEach((el) => { keep[el.name] = el.value; });
        const two = courses.length > 1;
        mealsEl.innerHTML = `<b>Who's coming, and what would they like?</b><span class="meal-help">Enter each guest's name and choose ${two ? 'a ' + courses.map((c) => c.label.toLowerCase()).join(' and a ') : 'a meal'} for them, so the kitchen knows who ordered what.</span>` +
          Array.from({ length: n }, (_, i) => `<div class="meal-guest"><input name="guest_${i}" placeholder="Place ${i + 1}: guest name" maxlength="60" autocomplete="off" required value="${esc(keep[`guest_${i}`] ?? '')}" />${courses.map((c) => `
            <div class="meal-row"><span>${esc(c.label)}</span><select name="pick_${c.id}_${i}" required>
              <option value="">Select…</option>${c.items.map((it) => `<option value="${it.id}"${keep[`pick_${c.id}_${i}`] === it.id ? ' selected' : ''}>${esc(it.name)}${(it.tags || []).length ? ' (' + it.tags.join(', ') + ')' : ''}</option>`).join('')}
            </select></div>`).join('')}</div>`).join('');
        mealsEl.hidden = false;
        syncFirstName();
      }

      // Place 1 is usually the person booking: fill their name in until they type something else.
      let firstTouched = false;
      function syncFirstName() {
        const g0 = form.elements.guest_0;
        if (!g0) return;
        g0.addEventListener('input', () => { firstTouched = true; });
        if (!g0.value && !firstTouched) g0.value = form.elements.name.value;
      }
      form.elements.name.addEventListener('input', () => {
        const g0 = form.elements.guest_0;
        if (g0 && !firstTouched) g0.value = form.elements.name.value;
      });

      function fillGuests(max) {
        const prev = guestsSel.value;
        guestsSel.innerHTML = '';
        for (let i = 1; i <= max; i++) guestsSel.add(new Option(i + (i === 1 ? ' place' : ' places'), i));
        if (prev && Number(prev) <= max) guestsSel.value = prev;
        renderMeals(); setLabel();
      }

      guestsSel.addEventListener('change', () => { renderMeals(); setLabel(); });

      function applyStatus(s) {
        price = s.price ?? price;
        courses = s.courses || null;
        const closed = s.bookable === false;
        const soldOut = !!s.soldOut;

        $('[data-price]', panel).textContent = money(price) + ' per head';
        const closes = $('[data-closes]', panel);
        if (s.closesAt && !closed) {
          closes.textContent = 'Book by ' + new Date(s.closesAt + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + '.';
          closes.hidden = false;
        } else closes.hidden = true;

        const full = $('[data-full]', panel);
        full.innerHTML = closed
          ? 'Booking for this event has closed.<br />Email <a href="mailto:events@gyc.org.gg">events@gyc.org.gg</a> if you still need a place.'
          : 'Sorry — this event is now fully booked.<br />Email <a href="mailto:events@gyc.org.gg">events@gyc.org.gg</a> to join the waiting list.';
        form.style.display = closed || soldOut ? 'none' : 'grid';
        full.classList.toggle('show', closed || soldOut);
        renderMenuCard();
        fillGuests(Math.max(1, s.maxGuests ?? s.maxPerBooking ?? ev.maxPerBooking));
      }

      async function load() {
        try {
          const r = await fetch('/api/booking?event=' + encodeURIComponent(ev.id));
          applyStatus(await r.json());
        } catch (e) {
          fillGuests(ev.maxPerBooking);
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.classList.remove('show');
        const f = form.elements;
        const guests = Number(f.guests.value);
        const payload = {
          event: ev.id, guests,
          name: f.name.value.trim(), email: f.email.value.trim(),
          phone: f.phone.value.trim(), notes: f.notes.value.trim(),
        };
        if (!payload.name || !payload.email) return showErr('Please enter your name and email.');
        if (courses) {
          payload.names = Array.from({ length: guests }, (_, i) => (f[`guest_${i}`]?.value || '').trim());
          if (payload.names.some((n) => !n)) return showErr('Please give a name for every place.');
          payload.picks = {};
          for (const c of courses) {
            payload.picks[c.id] = Array.from({ length: guests }, (_, i) => f[`pick_${c.id}_${i}`]?.value || '');
            if (payload.picks[c.id].some((m) => !m)) return showErr(`Please choose a ${c.label.toLowerCase()} for every place.`);
          }
        }
        pay.disabled = true; pay.textContent = 'Opening secure payment…';
        try {
          const r = await fetch('/api/create-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const d = await r.json();
          if (!r.ok || !d.paymentUrl) {
            showErr(d.error || 'Sorry, something went wrong. Please try again.');
            if (d.event) applyStatus(d);
            pay.disabled = false; setLabel();
            return;
          }
          window.location.href = d.paymentUrl; // nothing is confirmed until they've paid
        } catch (err) {
          showErr('Network error — please check your connection and try again.');
          pay.disabled = false; setLabel();
        }
      });

      fillGuests(ev.maxPerBooking);
      load();
    }

    select(location.hash.slice(1), false);
  </script>
</body>
</html>
